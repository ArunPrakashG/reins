[package]
name = "daemon"
version.workspace = true
edition.workspace = true

[lib]
name = "daemon"
path = "src/lib.rs"

[[bin]]
name = "reinsd"
path = "src/main.rs"

[dependencies]
reins_core = { path = "../core" }
adapters = { path = "../../packages/adapters" }
store = { path = "../store" }
proto = { path = "../../packages/proto" }
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde_json.workspace = true
toml.workspace = true
vt100 = "0.15"

[dev-dependencies]
store = { path = "../store", features = ["test-support"] }
