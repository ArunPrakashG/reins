[workspace]
resolver = "2"
members = [
    "apps/core",
    "apps/daemon",
    "apps/store",
    "packages/proto",
    "packages/adapters",
    "ui/tui",
]

[workspace.package]
version = "0.1.2"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
