[workspace]
resolver = "2"
members = [
    "apps/core",
    "apps/daemon",
    "apps/store",
    "packages/proto",
    "packages/adapters",
    "ui/tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
toml = "0.8"
